name: Validate MenuStore build

on:
  push:
    branches:
      - feat/multi-tenant-foundation
  pull_request:
    branches:
      - feat/multi-tenant-foundation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: menustore-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: TypeScript and Next.js production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
